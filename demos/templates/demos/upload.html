{% extends 'base.html' %}

{% block title %}Upload a CSV file{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">
        <h1 class="h4 fw-semibold mb-3">Upload a CSV file</h1>

        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_div }}
                    <button type="submit" class="btn btn-primary mt-3">Upload</button>
                </form>

                {% if result is not None %}
                    <p class="alert alert-secondary mt-3 mb-0">Average of numbers:
                    <strong>{{ result }}</strong></p>
                {% endif %}

                {% if error %}
                    <p class="alert alert-danger mt-3 mb-0">{{ error }}</p>
                {% endif %}
            </div>
        </div>

        <a class="btn btn-outline-secondary mt-3" href="{% url 'home:index' %}">Back to hub</a>
    </div>
</div>

{% endblock %}
